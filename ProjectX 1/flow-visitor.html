<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Visitor Management Flow – Trackify</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600;700&display=swap');
  @page { size: A4 portrait; margin: 20mm; }
  @media print { body { margin: 0; } }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'EB Garamond', Garamond, 'Times New Roman', serif;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20mm;
  }
  h1 { font-size: 18pt; font-weight: 700; text-align: center; margin-bottom: 4pt; }
  p.sub { font-size: 12pt; color: #444; text-align: center; margin-bottom: 12pt; }
  svg text { font-family: 'EB Garamond', Garamond, 'Times New Roman', serif; }
</style>
</head>
<body>
<h1>Visitor Management Flow</h1>
<p class="sub">Trackify – OTP-Based Visitor Verification Process</p>
<svg width="560" height="960" viewBox="0 0 560 960" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#222"/>
    </marker>
  </defs>

  <!-- Swim lane backgrounds -->
  <rect x="10"  y="10" width="260" height="940" rx="8" fill="#fafafa" stroke="#ccc" stroke-width="1.2"/>
  <rect x="290" y="10" width="260" height="940" rx="8" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2"/>
  <text x="140" y="36" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">RESIDENT</text>
  <text x="420" y="36" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">GUARD / SYSTEM</text>
  <line x1="275" y1="10" x2="275" y2="950" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5,4"/>

  <!-- RESIDENT SIDE -->
  <ellipse cx="140" cy="72" rx="90" ry="24" fill="#222"/>
  <text x="140" y="77" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">START</text>
  <line x1="140" y1="96" x2="140" y2="118" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="30" y="120" width="220" height="52" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="140" y="142" text-anchor="middle" font-size="13" font-weight="bold">Create Visitor Pass</text>
  <text x="140" y="160" text-anchor="middle" font-size="12" fill="#555">Name · Phone · Purpose · Time</text>
  <line x1="140" y1="172" x2="140" y2="194" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="30" y="196" width="220" height="52" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="140" y="218" text-anchor="middle" font-size="13" font-weight="bold">System Generates OTP</text>
  <text x="140" y="236" text-anchor="middle" font-size="12" fill="#555">6-digit · 24 hr expiry</text>
  <line x1="140" y1="248" x2="140" y2="270" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="30" y="272" width="220" height="52" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="140" y="294" text-anchor="middle" font-size="13" font-weight="bold">SMS Sent to Visitor</text>
  <text x="140" y="312" text-anchor="middle" font-size="12" fill="#555">via Twilio API</text>
  <line x1="140" y1="324" x2="140" y2="346" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="30" y="348" width="220" height="52" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="140" y="370" text-anchor="middle" font-size="13" font-weight="bold">Pass Saved (pending)</text>
  <text x="140" y="388" text-anchor="middle" font-size="12" fill="#555">visitor_passes table</text>

  <!-- Cross-lane arrow -->
  <line x1="250" y1="374" x2="290" y2="374" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <text x="270" y="366" text-anchor="middle" font-size="11" fill="#555">arrives</text>

  <!-- Resident notification (bottom) -->
  <rect x="30" y="760" width="220" height="52" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="140" y="782" text-anchor="middle" font-size="13" font-weight="bold">Resident Receives Alert</text>
  <text x="140" y="800" text-anchor="middle" font-size="12" fill="#555">In-app + SMS notification</text>

  <!-- GUARD SIDE -->
  <ellipse cx="420" cy="72" rx="90" ry="24" fill="#444"/>
  <text x="420" y="77" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">VISITOR ARRIVES</text>
  <line x1="420" y1="96" x2="420" y2="400" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>

  <rect x="310" y="402" width="220" height="52" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="420" y="424" text-anchor="middle" font-size="13" font-weight="bold">Guard Enters OTP</text>
  <text x="420" y="442" text-anchor="middle" font-size="12" fill="#555">On guard tablet interface</text>
  <line x1="420" y1="454" x2="420" y2="476" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="310" y="478" width="220" height="52" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="420" y="500" text-anchor="middle" font-size="13" font-weight="bold">POST /api/visitors/verify-otp</text>
  <text x="420" y="518" text-anchor="middle" font-size="12" fill="#555">System validates OTP</text>
  <line x1="420" y1="530" x2="420" y2="552" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- D: OTP valid? -->
  <polygon points="420,554 530,590 420,626 310,590" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <text x="420" y="585" text-anchor="middle" font-size="13" font-weight="bold">OTP Valid &amp;</text>
  <text x="420" y="601" text-anchor="middle" font-size="13" font-weight="bold">Not Expired?</text>
  <!-- No right -->
  <line x1="530" y1="590" x2="548" y2="590" stroke="#222" stroke-width="1.8"/>
  <rect x="548" y="572" width="10" height="36" rx="3" fill="#ffe0e0" stroke="#c00" stroke-width="1"/>
  <text x="553" y="594" text-anchor="middle" font-size="8" fill="#c00" transform="rotate(90,553,590)">Deny</text>
  <text x="542" y="582" font-size="11" fill="#c00" font-weight="bold">No</text>
  <!-- Yes down -->
  <line x1="420" y1="626" x2="420" y2="648" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="438" y="641" font-size="12" fill="#080" font-weight="bold">Yes</text>

  <rect x="310" y="650" width="220" height="52" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="420" y="672" text-anchor="middle" font-size="13" font-weight="bold">Log Entry Time</text>
  <text x="420" y="690" text-anchor="middle" font-size="12" fill="#555">status → verified · entry_time = NOW()</text>
  <line x1="420" y1="702" x2="420" y2="724" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="310" y="726" width="220" height="52" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="420" y="748" text-anchor="middle" font-size="13" font-weight="bold">Allow Entry</text>
  <text x="420" y="766" text-anchor="middle" font-size="12" fill="#555">Gate opens · Visitor proceeds</text>

  <!-- Cross-lane notify -->
  <line x1="310" y1="786" x2="250" y2="786" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <text x="280" y="778" text-anchor="middle" font-size="11" fill="#555">notify</text>

  <rect x="310" y="840" width="220" height="52" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="420" y="862" text-anchor="middle" font-size="13" font-weight="bold">Log Exit Time on Departure</text>
  <text x="420" y="880" text-anchor="middle" font-size="12" fill="#555">Guard updates exit_time</text>
  <line x1="420" y1="892" x2="420" y2="914" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>

  <ellipse cx="420" cy="930" rx="90" ry="24" fill="#222"/>
  <text x="420" y="935" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">VISIT COMPLETE</text>
</svg>
</body>
</html>
